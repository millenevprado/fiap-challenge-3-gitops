# kube-prometheus-stack: Prometheus (metrics), Grafana (visualization),
# kube-state-metrics and node-exporter (cluster resource usage).
fullnameOverride: kps

crds:
  enabled: true

# EKS manages the control plane: these targets are not scrapeable.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false

# Alerting will be done by Grafana Alerting (PagerDuty/Slack), so
# Alertmanager is not deployed.
alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    # The OTel Collector pushes application metrics here
    # (prometheusremotewrite exporter -> /api/v1/write).
    enableRemoteWriteReceiver: true
    retention: 3d
    # Pick up ServiceMonitors/PodMonitors from any release/namespace.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi

grafana:
  # Admin credentials come from AWS Secrets Manager (ExternalSecret
  # "grafana-admin"), never from Git:
  #   aws secretsmanager get-secret-value --secret-id togglemaster-observability
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # PAGERDUTY_ROUTING_KEY and SLACK_WEBHOOK_URL, referenced as ${VAR} in the
  # alerting provisioning file (platform/observability/alerting.yaml).
  envFromSecret: grafana-alerting

  grafana.ini:
    server:
      # Access via `kubectl -n observability port-forward svc/kube-prometheus-stack-grafana 3000:80`.
      root_url: http://localhost:3000

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  sidecar:
    # Dashboards provisioned as code from ConfigMaps labelled
    # grafana_dashboard (platform/observability).
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    # Alert rules, contact points and notification policies provisioned as
    # code from ConfigMaps labelled grafana_alert (platform/observability).
    alerts:
      enabled: true
      label: grafana_alert
      searchNamespace: ALL

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        maxLines: 1000
