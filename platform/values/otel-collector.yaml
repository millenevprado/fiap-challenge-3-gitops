# OpenTelemetry Collector: the single entry point for telemetry.
#
#   apps (OTel SDK, OTLP/HTTP :4318) ─┐
#   container logs (filelog)  ────────┼─> Collector ─┬─> Prometheus (metrics, remote write)
#                                     │              ├─> Loki       (logs, OTLP)
#                                     │              └─> New Relic  (traces + metrics, OTLP)
#
# DaemonSet: one collector per node. The Service uses
# internalTrafficPolicy=Local, so a pod always talks to the collector on its
# own node (no cross-node hop, and the k8sattributes processor sees the
# real pod IP to enrich telemetry with pod/namespace/deployment metadata).
mode: daemonset
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

presets:
  # filelog receiver reading /var/log/pods/* on each node (all containers).
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # k8sattributes processor (+ RBAC): adds k8s.pod.name, k8s.deployment.name...
  kubernetesAttributes:
    enabled: true

# Apps send OTLP to http://otel-collector.observability.svc.cluster.local:4318
service:
  enabled: true
  internalTrafficPolicy: Local

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# New Relic credentials from AWS Secrets Manager (ExternalSecret).
extraEnvsFrom:
  - secretRef:
      name: otel-collector-newrelic

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

config:
  receivers:
    jaeger: null
    zipkin: null
  processors:
    resource/cluster:
      attributes:
        - key: k8s.cluster.name
          value: togglemaster-eks
          action: upsert
        - key: deployment.environment.name
          value: fiap
          action: upsert
    # Container logs have no service.name: derive it from the container name
    # so Loki indexes them as service_name="auth-service", etc.
    transform/logs-service-name:
      error_mode: ignore
      log_statements:
        - context: resource
          statements:
            - set(attributes["service.name"], attributes["k8s.container.name"]) where attributes["service.name"] == nil
    # Health checks are noise in APM.
    filter/health:
      error_mode: ignore
      traces:
        span:
          - attributes["url.path"] == "/health"
          - attributes["http.target"] == "/health"
  exporters:
    otlphttp/newrelic:
      endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
      headers:
        api-key: ${env:NEW_RELIC_LICENSE_KEY}
      compression: gzip
    prometheusremotewrite:
      endpoint: http://kps-prometheus.observability.svc.cluster.local:9090/api/v1/write
      # service.name -> label service_name, k8s.pod.name -> k8s_pod_name...
      resource_to_telemetry_conversion:
        enabled: true
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, filter/health, resource/cluster, batch]
        exporters: [otlphttp/newrelic]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, resource/cluster, batch]
        exporters: [prometheusremotewrite, otlphttp/newrelic]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource/cluster, transform/logs-service-name, batch]
        exporters: [otlphttp/loki]
