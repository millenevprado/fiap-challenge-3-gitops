# Every credential used by the observability stack lives in the AWS Secrets
# Manager secret "togglemaster-observability" (created by Terraform in
# fiap-challenge-3-infra). External Secrets Operator turns it into regular
# Kubernetes Secrets here; nothing sensitive is committed to Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: togglemaster-observability
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        key: togglemaster-observability
        property: grafana_admin_password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-alerting
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: grafana-alerting
    creationPolicy: Owner
  data:
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef:
        key: togglemaster-observability
        property: pagerduty_routing_key
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: togglemaster-observability
        property: slack_webhook_url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otel-collector-newrelic
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: otel-collector-newrelic
    creationPolicy: Owner
  data:
    - secretKey: NEW_RELIC_LICENSE_KEY
      remoteRef:
        key: togglemaster-observability
        property: newrelic_license_key
    - secretKey: NEW_RELIC_OTLP_ENDPOINT
      remoteRef:
        key: togglemaster-observability
        property: newrelic_otlp_endpoint
