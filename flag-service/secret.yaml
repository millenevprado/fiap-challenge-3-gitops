apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flag-service-secrets
  namespace: togglemaster
  labels:
    app.kubernetes.io/name: flag-service
    app.kubernetes.io/part-of: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: flag-service-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  data:
    - secretKey: username
      remoteRef:
        key: togglemaster-flag-db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: togglemaster-flag-db-credentials
        property: password
    - secretKey: host
      remoteRef:
        key: togglemaster-flag-db-credentials
        property: host
    - secretKey: port
      remoteRef:
        key: togglemaster-flag-db-credentials
        property: port
    - secretKey: dbname
      remoteRef:
        key: togglemaster-flag-db-credentials
        property: dbname
